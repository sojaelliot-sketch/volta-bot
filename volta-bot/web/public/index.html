<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1611">
<title>VOLTA — Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   VOLTA MANAGER
   Design: a floodlit pitch at night. Deep grass-black ground,
   chalk-white markings, sodium-lamp coral for anything live, mint
   for money moving in the right direction. Numbers are set like a
   stadium scoreboard because that is what they are.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --pitch:#0B1611;
  --pitch-2:#122019;
  --pitch-3:#1A2C22;
  --chalk:#E9F0EA;
  --chalk-dim:#8A9C90;
  --line:rgba(233,240,234,.11);
  --line-2:rgba(233,240,234,.22);
  --hot:#FF5C39;
  --mint:#4DD9A6;
  --gold:#F2C14E;
  --loss:#E4574B;
  --r:14px;
  --tap:46px;
}
[data-theme="day"]{
  --pitch:#F2F4F0; --pitch-2:#FFFFFF; --pitch-3:#E7EBE5;
  --chalk:#101A14; --chalk-dim:#5E6F64;
  --line:rgba(16,26,20,.12); --line-2:rgba(16,26,20,.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--pitch); color:var(--chalk);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  transition:background .3s,color .3s;
}
/* Faint mown-grass stripes. Subtle enough to read as texture, not decoration. */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
  background:repeating-linear-gradient(100deg,transparent 0 58px,rgba(255,255,255,.014) 58px 116px);
}
.num{font-family:'Archivo Narrow','Archivo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 20px;position:relative;z-index:1}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit}
a{color:var(--hot)}

/* ── connection strip ── */
#netbar{position:fixed;top:0;left:0;right:0;z-index:60;padding:7px 14px;font-size:12.5px;
  font-weight:600;text-align:center;transform:translateY(-100%);transition:transform .25s;
  padding-top:calc(7px + env(safe-area-inset-top))}
#netbar.show{transform:translateY(0)}
#netbar.bad{background:var(--loss);color:#fff}
#netbar.ok{background:var(--mint);color:#04150E}

/* ── login ── */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:380px}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.mark .dot{width:34px;height:34px;border-radius:10px;background:var(--hot);display:grid;place-items:center;
  font-weight:900;font-size:15px;color:#160603;transform:rotate(-6deg)}
.mark span{font-weight:800;letter-spacing:.22em;font-size:12.5px;color:var(--chalk-dim)}
.gate h1{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1;margin-bottom:8px}
.gate .sub{color:var(--chalk-dim);font-size:14.5px;margin-bottom:28px}
.field{width:100%;background:var(--pitch-2);border:1px solid var(--line-2);border-radius:12px;
  padding:14px 15px;color:var(--chalk);font-size:16px;margin-bottom:11px;min-height:var(--tap);
  transition:border-color .15s}
.field::placeholder{color:var(--chalk-dim)}
.field:focus{outline:none;border-color:var(--hot)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);
  padding:13px 20px;border-radius:12px;font-weight:700;font-size:15px;
  background:var(--hot);color:#180703;transition:transform .12s,opacity .15s;width:100%}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--chalk)}
.btn.mint{background:var(--mint);color:#04150E}
.btn.sm{min-height:38px;padding:8px 14px;font-size:13.5px;width:auto;border-radius:10px}
.msg{padding:11px 13px;border-radius:11px;font-size:13.5px;margin-bottom:12px;display:none}
.msg.bad{background:rgba(228,87,75,.14);border:1px solid rgba(228,87,75,.4);color:#FF9C93;display:block}

/* ── scoreboard hero ── */
.board{background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.board::after{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(255,92,57,.16),transparent 70%);pointer-events:none}
.board .who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.board .club{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
.board .rank{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--chalk-dim);margin-top:2px}
.bal{font-family:'Archivo Narrow',sans-serif;font-size:clamp(42px,13vw,60px);font-weight:700;
  line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal small{font-size:15px;color:var(--chalk-dim);font-weight:600;letter-spacing:.1em;
  display:block;margin-bottom:4px;font-family:'Archivo',sans-serif}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;
  background:var(--pitch-3);border:1px solid var(--line)}
.chip.w{color:var(--mint)} .chip.l{color:var(--loss)} .chip.g{color:var(--gold)}

/* ── generic surfaces ── */
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:420px){.g3{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .k{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--chalk-dim);margin-bottom:5px}
.tile .v{font-family:'Archivo Narrow',sans-serif;font-size:25px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.sec{margin:22px 0 11px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:13px;font-weight:800;letter-spacing:.13em;color:var(--chalk-dim)}
.sec .act{font-size:13px;font-weight:700;color:var(--hot)}

/* ── player rows ── */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;background:var(--pitch-2);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;transition:border-color .15s;text-align:left;width:100%}
.prow:active{border-color:var(--line-2)}
.ovr{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  font-family:'Archivo Narrow',sans-serif;font-size:19px;font-weight:700;background:var(--pitch-3)}
.ovr.Common{color:var(--chalk-dim)}
.ovr.Rare{color:#6FC3FF;box-shadow:inset 0 0 0 1px rgba(111,195,255,.35)}
.ovr.Elite{color:#C79BFF;box-shadow:inset 0 0 0 1px rgba(199,155,255,.4)}
.ovr.Legendary{color:var(--gold);box-shadow:inset 0 0 0 1px rgba(242,193,78,.5)}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:12.5px;color:var(--chalk-dim);margin-top:1px}
.pright{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;flex:0 0 auto;
  font-variant-numeric:tabular-nums}

/* ── tabs ── */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(11,22,17,.93);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
[data-theme="day"] nav.tabs{background:rgba(255,255,255,.93)}
nav.tabs button{flex:1;padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--chalk-dim);min-height:62px;
  transition:color .15s}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--hot)}

/* ── toast ── */
#toasts{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:70;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:732px;margin:0 auto}
.toast{background:var(--pitch-3);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;
  font-size:14px;font-weight:600;animation:pop .22s ease-out;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.toast.win{border-color:rgba(77,217,166,.5);color:var(--mint)}
.toast.bad{border-color:rgba(228,87,75,.5);color:#FF9C93}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── skeleton ── */
.skel{background:linear-gradient(90deg,var(--pitch-2) 25%,var(--pitch-3) 50%,var(--pitch-2) 75%);
  background-size:200% 100%;animation:sweep 1.3s infinite;border-radius:12px;height:64px}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 18px;color:var(--chalk-dim);font-size:14.5px}
.empty .big{font-size:30px;margin-bottom:8px}

/* player sheet */
.sheet{position:relative;background:var(--pitch-2);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sheet h3{font-family:'Fraunces',serif;font-weight:500;font-size:21px;margin-bottom:2px}
.sheet .sub{font-size:13px;color:var(--chalk-dim);margin-bottom:14px}
.statrow{display:grid;grid-template-columns:74px 1fr 34px;gap:9px;align-items:center;margin-bottom:6px;font-size:12.5px}
.statrow .sk{color:var(--chalk-dim);text-transform:capitalize}
.statrow .sv{font-family:'IBM Plex Mono',monospace;text-align:right}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}

/* history */
.hrow{display:flex;align-items:center;gap:11px;background:var(--pitch-2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:7px}
.res{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.res.W{background:rgba(77,217,166,.16);color:var(--mint)}
.res.L{background:rgba(228,87,75,.16);color:var(--loss)}
.res.D{background:rgba(233,240,234,.1);color:var(--chalk-dim)}

/* segmented control */
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:78px;padding:9px;border-radius:10px;border:1px solid var(--line-2);
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--chalk-dim);background:transparent}
.seg button.on{border-color:var(--hot);color:var(--hot)}

/* ── slot ── */
.reels{display:flex;gap:9px;justify-content:center;margin:18px 0}
.reel{width:66px;height:78px;background:var(--pitch-3);border:1px solid var(--line-2);border-radius:13px;
  display:grid;place-items:center;font-size:33px}
.reel.spin{animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.stakerow{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.stakerow .field{margin:0;flex:1}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="netbar"></div>
<div id="toasts"></div>

<!-- ══ LOGIN ══ -->
<section id="gate" class="gate">
  <div class="gate-card">
    <div class="mark"><div class="dot">V</div><span>METAWORKS</span></div>
    <h1>Manager</h1>
    <p class="sub">Sign in with your club name and the password you set with <b>!password</b> in the group.</p>
    <div class="msg" id="loginMsg"></div>
    <input class="field" id="lname" placeholder="Club name" autocomplete="username">
    <input class="field" id="lpass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn">Sign in</button>
    <p style="margin-top:18px;font-size:13px;color:var(--chalk-dim);text-align:center">
      Easiest way in: send <b>!site</b> to the bot and tap the link.<br>
      Otherwise set a password with <b>!password</b>.
    </p>
    <div style="margin-top:20px;text-align:center">
      <button class="btn ghost sm" onclick="document.getElementById('srv').classList.toggle('hidden')">Server address</button>
    </div>
    <div id="srv" class="hidden" style="margin-top:12px">
      <input class="field" id="srvUrl" placeholder="https://your-backend-url">
      <button class="btn ghost" onclick="saveServer()">Save address</button>
      <p style="font-size:12px;color:var(--chalk-dim);margin-top:8px">
        Only needed if the bot's address changed and you have no !site link.
      </p>
    </div>
  </div>
</section>

<!-- ══ APP ══ -->
<main id="app" class="wrap hidden">
  <div id="view"></div>
</main>

<nav class="tabs hidden" id="tabs">
  <button data-tab="home" class="on"><span class="ic">◆</span>Club</button>
  <button data-tab="squad"><span class="ic">▦</span>Squad</button>
  <button data-tab="market"><span class="ic">⇄</span>Market</button>
  <button data-tab="play"><span class="ic">◉</span>Play</button>
  <button data-tab="table"><span class="ic">≡</span>Table</button>
</nav>

<script>
/* ═══════════════════════════════════════════════════════════════
   API LAYER
   The old client fired bare fetch() calls with no timeout, no retry
   and no handling for an expired session — a dropped packet on a
   phone network left the page silently stuck. This layer times out,
   retries idempotent reads with backoff, surfaces connection state,
   and logs you out cleanly on a 401 instead of showing nothing.
   ═══════════════════════════════════════════════════════════════ */
const EXTRA={'ngrok-skip-browser-warning':'true'};
const S={token:null,user:null,tab:'home',squad:null,busy:new Set()};

const BACKEND='https://fallen-largest-butter-implemented.trycloudflare.com';
function base(){
  const saved=localStorage.getItem('volta_base');
  if(saved) return saved.replace(/\/$/,'');
  const here=location.hostname;
  if(here==='localhost'||here==='127.0.0.1') return location.origin;
  return BACKEND.replace(/\/$/,'');
}
function setBase(b){ if(b) localStorage.setItem('volta_base', String(b).replace(/\/$/,'')); }

// A !site link looks like  https://…/#c=<base64url({b:backend,t:ticket})>
// It carries the backend address AND a single-use login ticket, so one tap both
// points the site at the right server and signs the player in. Before this, the
// only way to connect was setting a localStorage key by hand in dev tools.
async function consumeConnectLink(){
  const m = /[#&]c=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if(!m) return false;
  let payload;
  try{
    payload = JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')));
  }catch{ return false; }
  // Clear it from the address bar immediately — it is a credential.
  history.replaceState(null,'',location.pathname+location.search);
  if(payload.b) setBase(payload.b);
  if(!payload.t) return false;
  try{
    const r = await fetch(base()+'/api/connect',{
      method:'POST', headers:{'Content-Type':'application/json',...EXTRA},
      body: JSON.stringify({ticket:payload.t})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'Link expired');
    saveToken(d.token); S.user=d.user; enterApp();
    toast('Connected','win');
    return true;
  }catch(e){
    const msg=document.getElementById('loginMsg');
    if(msg){ msg.className='msg bad'; msg.textContent=e.message||'That link has expired. Send !site again.'; }
    return false;
  }
}
function saveToken(t){ t?localStorage.setItem('volta_token',t):localStorage.removeItem('volta_token'); S.token=t; }

let netOk=true;
function net(ok,text){
  const b=document.getElementById('netbar');
  if(ok===netOk&&!text) return;
  netOk=ok;
  if(ok){ b.className='ok show'; b.textContent=text||'Back online'; setTimeout(()=>b.className='ok',1800); }
  else { b.className='bad show'; b.textContent=text||'No connection — retrying'; }
}

async function api(path,{method='GET',body=null,retries=2,timeout=9000}={}){
  const key=method+path;
  for(let attempt=0;attempt<=retries;attempt++){
    const ac=new AbortController();
    const timer=setTimeout(()=>ac.abort(),timeout);
    try{
      const opts={method,headers:{...EXTRA},signal:ac.signal};
      if(body){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify({...body,token:S.token}); }
      let url=base()+path;
      if(method==='GET'&&S.token) url+=(path.includes('?')?'&':'?')+'token='+encodeURIComponent(S.token);
      const r=await fetch(url,opts);
      clearTimeout(timer);
      if(r.status===401){ logout('Session expired — sign in again.'); throw new Error('unauthorised'); }
      const data=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error||('Request failed ('+r.status+')'));
      net(true);
      return data;
    }catch(e){
      clearTimeout(timer);
      if(e.message==='unauthorised') throw e;
      const last=attempt===retries;
      // Only retry reads. Replaying a POST could buy the same pack twice.
      if(last||method!=='GET'){
        if(e.name==='AbortError'||e.message==='Failed to fetch') net(false);
        throw e;
      }
      await new Promise(r=>setTimeout(r,400*Math.pow(2,attempt)));
    }
  }
}

function toast(text,kind=''){
  const el=document.createElement('div');
  el.className='toast '+kind; el.textContent=text;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),320);},2600);
}

/* Guard against double-taps firing a purchase twice. */
async function once(key,fn){
  if(S.busy.has(key)) return;
  S.busy.add(key);
  try{ return await fn(); }
  catch(e){ toast(e.message||'Something went wrong','bad'); }
  finally{ S.busy.delete(key); }
}

const money=n=>Number(n||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ═══════════════ AUTH ═══════════════ */
async function login(){
  const name=document.getElementById('lname').value.trim();
  const pass=document.getElementById('lpass').value;
  const msg=document.getElementById('loginMsg');
  const btn=document.getElementById('loginBtn');
  if(!name||!pass){ msg.className='msg bad'; msg.textContent='Club name and password, please.'; return; }
  btn.disabled=true; btn.textContent='Signing in…'; msg.className='msg';
  try{
    const d=await api('/api/login',{method:'POST',body:{name,password:pass},retries:0});
    saveToken(d.token); S.user=d.user; enterApp();
  }catch(e){
    msg.className='msg bad'; msg.textContent=e.message||'Could not sign in.';
  }finally{ btn.disabled=false; btn.textContent='Sign in'; }
}
function logout(why){
  saveToken(null); S.user=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('tabs').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  if(why) toast(why,'bad');
}
function enterApp(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('tabs').classList.remove('hidden');
  render();
  startSync();
}

/* ═══════════════ LIVE SYNC ═══════════════
   The bot and the website are separate processes writing the same
   files. Without polling, your balance on screen goes stale the
   moment you do anything in WhatsApp. */
let syncTimer=null;
function startSync(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer=setInterval(async()=>{
    if(document.hidden||!S.token) return;
    try{
      const d=await api('/api/me',{retries:1,timeout:7000});
      const changed=!S.user||d.user.currency!==S.user.currency;
      S.user=d.user;
      if(changed) paintBoard();
    }catch(e){/* the strip already reports it */}
  },12000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
}
async function refresh(){
  try{ const d=await api('/api/me'); S.user=d.user; paintBoard(); }catch(e){}
}

/* ═══════════════ VIEWS ═══════════════ */
const V=document.getElementById('view');

function boardHTML(){
  const u=S.user||{};
  return `<div class="board" id="board">
    <div class="who">
      <div>
        <div class="club">${esc(u.name||'Manager')}</div>
        <div class="rank">${esc(u.rank||'Unranked')} · MMR ${u.mmr||0}</div>
      </div>
      <button class="btn ghost sm" onclick="toggleTheme()">◐</button>
    </div>
    <div class="bal"><small>BALANCE</small>${money(u.currency)}</div>
    <div class="chips">
      <span class="chip w">${u.wins||0}W</span>
      <span class="chip">${u.draws||0}D</span>
      <span class="chip l">${u.losses||0}L</span>
      <span class="chip">${u.winRate||0}% win</span>
      ${u.streak?`<span class="chip g">🔥 ${u.streak} day streak</span>`:''}
    </div>
  </div>`;
}
function paintBoard(){
  const b=document.getElementById('board');
  if(b) b.outerHTML=boardHTML();
}

// Mirrors utils/password.js so the site tells you the same thing the bot would,
// before you submit rather than after.
function strengthOf(p){
  if(!p) return {label:'',score:-1};
  if(p.length<6) return {label:`too short — ${p.length}/6`,score:-1};
  let n=0;
  if(p.length>=8)n++; if(p.length>=12)n++;
  if(/[a-z]/.test(p)&&/[A-Z]/.test(p))n++;
  if(/\d/.test(p))n++; if(/[^A-Za-z0-9]/.test(p))n++;
  n=Math.min(4,n);
  return {label:['weak','weak','okay','good','strong'][n],score:n};
}
function paintMeter(){
  const v=document.getElementById('pwNew').value;
  const s=strengthOf(v);
  const el=document.getElementById('pwMeter');
  if(!v){ el.textContent=''; return; }
  const bars=s.score<0?'▱▱▱▱':'▰'.repeat(s.score+1)+'▱'.repeat(4-s.score);
  el.textContent=`${bars}  ${s.label}`;
  el.style.color = s.score<0 ? 'var(--loss)' : s.score>=3 ? 'var(--mint)' : 'var(--chalk-dim)';
}
async function savePassword(){
  await once('pw',async()=>{
    const current=document.getElementById('pwCur').value;
    const password=document.getElementById('pwNew').value;
    if(!password){ toast('Type a new password first','bad'); return; }
    const d=await api('/api/password',{method:'POST',body:{current,password},retries:0});
    toast(`Password saved — ${d.strength}`,'win');
    document.getElementById('pwCur').value='';
    document.getElementById('pwNew').value='';
    document.getElementById('pwMeter').textContent='';
    document.getElementById('pwBox').classList.add('hidden');
  });
}

async function loadHistory(target='hist',limit=4){
  try{
    const d=await api('/api/mymatches');
    const el=document.getElementById(target);
    if(!el) return;
    const list=(d.matches||[]).slice(0,limit);
    if(!list.length){ el.innerHTML='<div class="empty">No matches yet. Send !play in the chat.</div>'; return; }
    const s=d.summary||{};
    el.innerHTML=(limit>10?`<div class="tile" style="margin-bottom:10px"><div class="k">LAST ${d.matches.length}</div>
      <div style="font-size:15px;margin-top:4px">${s.wins||0}W · ${s.draws||0}D · ${s.losses||0}L</div></div>`:'')+
      list.map(m=>`<div class="hrow">
        <div class="res ${m.outcome}">${m.outcome}</div>
        <div class="pinfo"><div class="pname">${esc(m.opponent||'Unknown')}</div>
          <div class="pmeta">${new Date(m.date).toLocaleDateString()}${m.mvp?` · MVP ${esc(m.mvp)}`:''}</div></div>
        <div class="pright">${m.myScore}–${m.oppScore}</div>
      </div>`).join('');
  }catch(e){
    const el=document.getElementById(target);
    if(el) el.innerHTML='<div class="empty">Could not load results.</div>';
  }
}

async function viewSquad(){

    const bench=new Set(d.user.bench||[]);
    const all=(d.user.roster||[]).slice().sort((a,b)=>b.total-a.total);
    document.getElementById('sqCount').textContent=all.length+' owned';
    document.getElementById('sq').innerHTML=all.length?`<div class="plist">${

    document.getElementById('sq').innerHTML=`<div class="empty">Could not load your squad.<br><button class="btn ghost sm" style="margin-top:12px" onclick="render()">Try again</button></div>`;
  }

// The API reports `total`: the sum of five stats, each out of 99. Convert it to
// a familiar 40-99 rating so the number means the same thing it does on a card.
function ratingOf(p){
  const t=Number(p&&p.total||0);
  if(!t) return '—';
  return Math.max(40,Math.min(99,Math.round(40+(t/(99*5))*59)));
}
function playerRow(p,slot,tappable){
  const r=p.rarity||'Common';
  const cond=Number(p.condition);
  const tag=tappable?`<button class="prow" onclick="openPlayer('${esc(p.id)}')">`:'<div class="prow">';
  const close=tappable?'</button>':'</div>';
  return `${tag}
    <div class="ovr ${esc(r)}">${ratingOf(p)}</div>
    <div class="pinfo"><div class="pname">${esc(p.name)}${p.isListed?' <span style="color:var(--gold);font-size:12px">· listed</span>':''}</div>
      <div class="pmeta">${esc(r)} · ${esc(p.role==='goalkeeper'?'GK':'Outfield')}${p.level?' · Lv.'+p.level:''}${
        Number.isFinite(cond)?` · ${cond}% fit`:''}</div></div>
    ${slot?`<div class="pright" style="font-size:11px;color:var(--chalk-dim)">${slot}</div>`:''}
  ${close}`;
}

let sheetFor=null;
async function openPlayer(id){
  const d=await api('/api/me'); S.user=d.user;
  const p=(d.user.roster||[]).find(x=>x.id===id);
  if(!p){ toast('Player not found','bad'); return; }

    <button class="backlink btn ghost sm" style="margin-bottom:12px" onclick="viewSquad()">← Squad</button>
    <div class="sheet">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
        <div class="ovr ${esc(p.rarity||'Common')}" style="width:60px;height:60px;font-size:26px;border-radius:14px">${ratingOf(p)}</div>
        <div style="flex:1;min-width:0">
          <h3>${esc(p.name)}</h3>
          <div class="sub">${esc(p.rarity||'')} · ${p.role==='goalkeeper'?'Goalkeeper':'Outfield'} · Lv.${p.level||1}${inXI?' · in the XI':''}</div>
        </div>
      </div>
      ${stats.map(([k,v])=>`
        <div class="statrow">
          <span class="sk">${esc(k)}</span>
          <span class="bar"><span style="width:${Math.min(100,v)}%;background:var(--hot)"></span></span>
          <span class="sv">${v}</span>
        </div>`).join('')}
      <div class="statrow" style="margin-top:10px">
        <span class="sk">condition</span>
        <span class="bar"><span style="width:${Math.min(100,p.condition||100)}%;background:${(p.condition||100)<50?'var(--loss)':'var(--mint)'}"></span></span>
        <span class="sv">${p.condition||100}</span>
      </div>
      <div class="acts">
        <button class="btn sm primary" onclick="trainPlayer('${esc(id)}',false)">Train</button>
        <button class="btn sm" onclick="trainPlayer('${esc(id)}',true)">Elite train</button>
        <button class="btn sm" onclick="boostPlayer('${esc(id)}')">Boost</button>
        <button class="btn sm" onclick="toggleXI('${esc(id)}')">${inXI?'Drop to bench':'Put in XI'}</button>
        ${p.isListed?'<button class="btn sm" disabled>Listed</button>'
          :`<button class="btn sm danger" onclick="listPlayer('${esc(id)}')">Sell</button>`}
      </div>
    </div>`;
}
async function trainPlayer(id,elite){
  await once('train'+id,async()=>{
    const d=await api('/api/shop/train',{method:'POST',body:{playerId:id,elite}});
    if(d.user) S.user=d.user;
    toast(elite?'Elite training done':'Training done','win');
    openPlayer(id);
  });
}
async function boostPlayer(id){
  await once('boost'+id,async()=>{
    const d=await api('/api/shop/boost',{method:'POST',body:{playerId:id,type:'stat'}});

async function listPlayer(id){
  const price=prompt('List for how much?');
  if(!price) return;
  await once('list'+id,async()=>{
    const d=await api('/api/market/list',{method:'POST',body:{playerId:id,price:parseInt(price,10)}});
    if(d.user) S.user=d.user;
    toast('Listed on the market','win'); viewSquad();
  });
}
async function toggleXI(id){
  await once('xi'+id,async()=>{
    const d=await api('/api/me'); const u=d.user;
    let xi=[...(u.startingXI||[])], bench=[...(u.bench||[])];
    if(xi.includes(id)){ xi=xi.filter(x=>x!==id); bench.push(id); }
    else { bench=bench.filter(x=>x!==id); xi.push(id); }
    const r=await api('/api/squad',{method:'POST',body:{startingXI:xi,bench}});
    if(r.user) S.user=r.user;
    toast('Line-up updated','win'); openPlayer(id);
  });
}

async function spin(){
  await once('spin',async()=>{
    const stake=parseInt(document.getElementById('slotStake').value,10)||50;
    const reels=document.getElementById('reels');
    [...reels.children].forEach(r=>r.classList.add('spin'));
    const btn=document.getElementById('spinBtn'); btn.disabled=true;
    try{
      const d=await api('/api/slot',{method:'POST',body:{stake}});
      await new Promise(r=>setTimeout(r,550));
      [...reels.children].forEach((r,i)=>{ r.classList.remove('spin'); r.textContent=d.reels[i]; });
      if(d.user) S.user=d.user;
      toast(d.net>0?`${d.label} +${money(d.net)}`:`No luck — ${money(Math.abs(d.net))}`, d.net>0?'win':'bad');
      paintBoard();
    } finally {
      [...reels.children].forEach(r=>r.classList.remove('spin'));
      btn.disabled=false;
    }
  });
}
async function hlStart(){
  await once('hlstart',async()=>{
    const stake=parseInt(document.getElementById('hlStake').value,10)||100;
    const d=await api('/api/highlow/start',{method:'POST',body:{stake}});
    document.getElementById('hlBox').innerHTML=`
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-family:'Archivo Narrow',sans-serif;font-size:52px;font-weight:700;line-height:1">${d.first}</div>
